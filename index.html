<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مطابقة المنيو — Menu Matcher</title>
<style>
:root{--bg:#0c1015;--bg2:#10151c;--card:#161b22;--txt:#f1f4f8;--muted:#97a2b3;--accent:#FF5A00;--green:#22b06b;--red:#ec4340;--radius:16px;--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #262c35}
.logo{font-size:24px;font-weight:900;display:flex;align-items:center;gap:10px}
.logo-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ff8533);display:grid;place-items:center;font-size:20px}
.nav{display:flex;gap:20px}
.nav button{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;padding:8px 12px;border-radius:8px;transition:all .2s}
.nav button.active{color:var(--accent);background:rgba(255,90,0,.1)}
.wizard{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-radius:10px;font-size:13px;border:1px solid #262c35}
.step.active{border-color:var(--accent);background:rgba(255,90,0,.1)}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.step.done .step-num{background:var(--green)}
.panel{display:none}
.panel.active{display:block}
.card{background:linear-gradient(180deg,var(--card),#1b2028);border:1px solid #262c35;border-radius:var(--radius);padding:24px;margin:20px 0;box-shadow:var(--shadow)}
h2{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input[type=file],input[type=text],textarea,select{width:100%;padding:10px;background:#0f151c;border:1px solid #262c35;border-radius:8px;color:var(--txt);font-family:inherit;font-size:14px}
textarea{resize:vertical;min-height:120px}
button{padding:10px 16px;background:linear-gradient(135deg,var(--accent),#ff8533);color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;transition:all .2s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,90,0,.3)}
button.secondary{background:transparent;border:1px solid #262c35;color:var(--muted)}
.row{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}
.row>div{flex:1;min-width:200px}
.result{padding:12px;background:rgba(34,176,107,.1);border-left:3px solid var(--green);border-radius:6px;margin:8px 0}
.result.error{background:rgba(236,67,64,.1);border-left-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--bg2);padding:12px;border-radius:10px;text-align:center}
.stat-val{font-size:20px;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;margin:12px 0}
th,td{padding:10px;text-align:start;border-bottom:1px solid #262c35;font-size:13px}
th{background:var(--bg2);font-weight:600}
.img-thumb{width:40px;height:40px;border-radius:6px;background:var(--bg2);border:1px solid #262c35;object-fit:cover}
.loading{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo"><span class="logo-icon">🍽️</span><div><strong>Menu</strong><br><small style="font-size:11px;color:var(--muted)">Matcher</small></div></div>
<div class="nav">
<button class="nav-btn active" data-panel="upload">📤 رفع</button>
<button class="nav-btn" data-panel="match">🍽️ مطابقة</button>
<button class="nav-btn" data-panel="export">📦 تصدير</button>
<button class="nav-btn" data-panel="admin">⚙️ إدارة</button>
</div>
</header>

<div class="wizard">
<div class="step active" data-step="1"><div class="step-num">1</div><span>المنيو</span></div>
<div class="step" data-step="2"><div class="step-num">2</div><span>مطابقة</span></div>
<div class="step" data-step="3"><div class="step-num">3</div><span>تصدير</span></div>
</div>

<!-- UPLOAD PANEL -->
<div id="upload" class="panel active">
<div class="card">
<h2>📤 رفع المنيو</h2>
<div class="row">
<div><label>ملف Excel</label><input type="file" id="menuFile" accept=".xlsx,.xls,.csv"></div>
<div><label>أو لصق النص</label><textarea id="menuText" placeholder="اسم الصنف - السعر..."></textarea></div>
</div>
<div class="row">
<div><label>رقم الصف (العناوين)</label><input type="number" id="headerRow" value="1" min="1"></div>
<div><label>عمود الاسم</label><input type="text" id="nameCol" placeholder="A" value="A"></div>
<div><label>عمود الفئة</label><input type="text" id="catCol" placeholder="B" value="B"></div>
</div>
<button onclick="parseMenu()">التالي: المطابقة ←</button>
<div id="parseResult"></div>
</div>
</div>

<!-- MATCH PANEL -->
<div id="match" class="panel">
<div class="card">
<h2>🍽️ مطابقة وتوليد</h2>
<div class="stats">
<div class="stat"><div class="stat-val" id="totalItems">0</div><div class="stat-lbl">إجمالي</div></div>
<div class="stat"><div class="stat-val" id="matchedCount">0</div><div class="stat-lbl">موجودة</div></div>
<div class="stat"><div class="stat-val" id="missingCount">0</div><div class="stat-lbl">ناقصة</div></div>
</div>
<div class="row">
<button onclick="matchNow()" style="flex:1">🔍 طابِق دلوقتي</button>
<button class="secondary" onclick="generateMissing()" style="flex:1">🎨 ولّد الناقص</button>
</div>
<table id="matchTable">
<thead><tr><th>الصنف</th><th>الفئة</th><th>الحالة</th><th>الصورة</th><th>إجراء</th></tr></thead>
<tbody></tbody>
</table>
<div id="matchResult"></div>
</div>
</div>

<!-- EXPORT PANEL -->
<div id="export" class="panel">
<div class="card">
<h2>📦 تصدير النتيجة</h2>
<div class="row">
<div><label>إيميل المرسل إليه</label><input type="email" id="recipientEmail" placeholder="restaurant@example.com"></div>
<div><label>الموضوع</label><input type="text" id="emailSubject" value="صور المنيو — Menu Images"></div>
</div>
<textarea id="emailBody" placeholder="نص البريد...">أرفق صور المنيو المحدثة</textarea>
<div class="row">
<button onclick="downloadZip()" style="flex:1">⬇️ تحميل ZIP</button>
<button onclick="sendViaEmail()" style="flex:1">✉️ إرسال بريد</button>
</div>
<div id="exportResult"></div>
</div>
</div>

<!-- ADMIN PANEL -->
<div id="admin" class="panel">
<div class="card">
<h2>⚙️ إعدادات n8n</h2>
<label>🧠 Claude Smart Matching Webhook</label>
<input type="text" id="webhookClaudeMatch" placeholder="https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-match-item" value="https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-match-item" style="margin-bottom:12px">
<label>🤖 Smart Suggestions Webhook</label>
<input type="text" id="webhookSuggestions" placeholder="https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-smart-suggestions" value="https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-smart-suggestions" style="margin-bottom:12px">
<label>🔄 Library Sync Webhook</label>
<input type="text" id="webhookLibSync" placeholder="https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-library-sync" value="https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-library-sync" style="margin-bottom:12px">
<label>📤 Image Generation Webhook</label>
<input type="text" id="webhookEmail" placeholder="https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-gen-image" value="https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-gen-image" style="margin-bottom:12px">
<button onclick="saveWebhooks()">💾 حفظ الإعدادات</button>
<div id="adminResult" style="margin-top:16px"></div>
</div>
</div>

</div>

<script>
const API = {
  parse: '/api/menu/parse',
  match: '/api/menu/match',
  generate: '/api/menu/generate',
  export: '/api/menu/export'
};

let menuData = { items: [], matched: {} };

// Load webhook settings on page load
window.addEventListener('DOMContentLoaded', () => {
  const webhookClaudeMatch = localStorage.getItem('webhookClaudeMatch') || 'https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-match-item';
  const webhookSuggestions = localStorage.getItem('webhookSuggestions') || 'https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-smart-suggestions';
  const webhookLibSync = localStorage.getItem('webhookLibSync') || 'https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-library-sync';
  const webhookEmail = localStorage.getItem('webhookEmail') || 'https://mono-mcp-server.dhhmena.com/n8n/webhook/menu-matcher-gen-image';

  document.getElementById('webhookClaudeMatch').value = webhookClaudeMatch;
  document.getElementById('webhookSuggestions').value = webhookSuggestions;
  document.getElementById('webhookLibSync').value = webhookLibSync;
  document.getElementById('webhookEmail').value = webhookEmail;

  // Set up nav buttons
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const panelId = e.target.dataset.panel;
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(panelId).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
    });
  });
});

const ui = {
  show: (panelId) => {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(panelId).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  },
  updateStats: () => {
    const matched = Object.values(menuData.matched).filter(m => m).length;
    document.getElementById('totalItems').textContent = menuData.items.length;
    document.getElementById('matchedCount').textContent = matched;
    document.getElementById('missingCount').textContent = menuData.items.length - matched;
  }
};

async function parseMenu() {
  const file = document.getElementById('menuFile').files[0];
  const text = document.getElementById('menuText').value;

  if (!file && !text) return alert('رفع ملف أو الصق نص');

  const formData = new FormData();
  if (file) formData.append('file', file);
  if (text) formData.append('text', text);
  formData.append('headerRow', document.getElementById('headerRow').value);
  formData.append('nameCol', document.getElementById('nameCol').value);
  formData.append('catCol', document.getElementById('catCol').value);

  try {
    const res = await fetch(API.parse, { method: 'POST', body: formData });
    menuData = await res.json();
    document.getElementById('parseResult').innerHTML = `<div class="result">✅ تم تحليل ${menuData.items.length} صنف</div>`;
    switchPanel('match');
    buildTable();
  } catch(e) {
    document.getElementById('parseResult').innerHTML = `<div class="result error">❌ ${e.message}</div>`;
  }
}

async function matchNow() {
  document.getElementById('matchResult').innerHTML = '<div class="result">⏳ جاري المطابقة بـ Claude...</div>';

  try {
    // Use direct Claude endpoint (workaround for deployment)
    const res = await fetch('/api/menu/match-claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: menuData.items })
    });
    const results = await res.json();
    menuData.matched = results.matched;
    ui.updateStats();
    buildTable();
    document.getElementById('matchResult').innerHTML = `<div class="result">✅ تمت المطابقة: ${results.count} مطابقة</div>`;
  } catch(e) {
    document.getElementById('matchResult').innerHTML = `<div class="result error">❌ ${e.message}</div>`;
  }
}

async function generateMissing() {
  const missing = menuData.items.filter((_, i) => !menuData.matched[i]);
  if (missing.length === 0) return alert('جميع الأصناف موجودة');

  document.getElementById('matchResult').innerHTML = '<div class="result">⏳ جاري التوليد...</div>';

  try {
    const res = await fetch(API.generate, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: missing })
    });
    const { generated } = await res.json();
    generated.forEach((g, i) => menuData.matched[missing.indexOf(g.item)] = g.image);
    ui.updateStats();
    buildTable();
    document.getElementById('matchResult').innerHTML = `<div class="result">✅ تم توليد ${generated.length} صورة</div>`;
  } catch(e) {
    document.getElementById('matchResult').innerHTML = `<div class="result error">❌ ${e.message}</div>`;
  }
}

function buildTable() {
  const tbody = document.querySelector('#matchTable tbody');
  tbody.innerHTML = menuData.items.map((item, i) => `
    <tr>
      <td>${item.name}</td>
      <td>${item.category}</td>
      <td>${menuData.matched[i] ? '✅' : '❌'}</td>
      <td>${menuData.matched[i] ? `<img class="img-thumb" src="${menuData.matched[i]}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22%3E%3Crect fill=%22%23262c35%22 width=%2240%22 height=%2240%22/%3E%3C/svg%3E">` : '-'}</td>
      <td><button class="secondary" onclick="uploadImage(${i})">📤</button></td>
    </tr>
  `).join('');
}

async function downloadZip() {
  try {
    const res = await fetch(API.export, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: menuData.items, matched: menuData.matched })
    });
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'menu-images.zip';
    a.click();
    document.getElementById('exportResult').innerHTML = '<div class="result">✅ تم التحميل</div>';
  } catch(e) {
    document.getElementById('exportResult').innerHTML = `<div class="result error">❌ ${e.message}</div>`;
  }
}

async function sendViaEmail() {
  const webhook = localStorage.getItem('webhookEmail');
  if (!webhook) return alert('أضف email webhook في الإدارة');

  const email = {
    to: document.getElementById('recipientEmail').value,
    subject: document.getElementById('emailSubject').value,
    body: document.getElementById('emailBody').value,
    items: menuData.items,
    matched: menuData.matched
  };

  try {
    const res = await fetch(webhook, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(email)
    });
    document.getElementById('exportResult').innerHTML = '<div class="result">✅ تم الإرسال</div>';
  } catch(e) {
    document.getElementById('exportResult').innerHTML = `<div class="result error">❌ ${e.message}</div>`;
  }
}

function saveWebhooks() {
  localStorage.setItem('webhookClaudeMatch', document.getElementById('webhookClaudeMatch').value);
  localStorage.setItem('webhookSuggestions', document.getElementById('webhookSuggestions').value);
  localStorage.setItem('webhookLibSync', document.getElementById('webhookLibSync').value);
  localStorage.setItem('webhookEmail', document.getElementById('webhookEmail').value);
  document.getElementById('adminResult').innerHTML = '<div class="result">✅ تم الحفظ</div>';
}

function switchPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function uploadImage(idx) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      menuData.matched[idx] = reader.result;
      ui.updateStats();
      buildTable();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const panelId = btn.dataset.panel;
    ui.show(panelId);
  });
});

ui.updateStats();
</script>
</body>
</html>
